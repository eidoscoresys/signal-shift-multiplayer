<text x="94" y="520" fill="#dfebf7" font-family="Segoe UI,Arial,sans-serif" font-size="29">Four roles. Three crises.</text><text x="94" y="566" fill="#a8bdd2" font-family="Segoe UI,Arial,sans-serif" font-size="29">One station worth saving.</text>
